name: ScatterNd Benchmark (Before vs After)

on:
  workflow_dispatch:
  push:
    branches:
      - benchmark-scatter-nd

permissions:
  contents: read

jobs:
  # =========================================================================
  # C++ KERNEL BENCHMARKS (Fast ~10 min, Nanosecond Precision, Direct Kernel)
  # =========================================================================
  cc-benchmark-baseline:
    name: C++ Baseline (master)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf build-essential

      - name: Install Bazelisk
        run: |
          sudo wget -q https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64 -O /usr/local/bin/bazel
          sudo chmod +x /usr/local/bin/bazel
          bazel --version

      - name: Configure TF
        run: |
          python -m pip install numpy packaging requests
          export TF_NEED_CUDA=0
          export TF_NEED_ROCM=0
          export CC_OPT_FLAGS="-march=native"
          export PYTHON_BIN_PATH=$(which python)
          export USE_DEFAULT_PYTHON_LIB_PATH=1
          export TF_SET_ANDROID_WORKSPACE=0
          export TF_CONFIGURE_IOS=0
          yes "" | python configure.py || true

      - name: Run C++ Google Benchmark
        run: |
          bazel run -c opt \
            --config=nogcp \
            --config=nonccl \
            --jobs=4 \
            --local_ram_resources=HOST_RAM*0.7 \
            //tensorflow/core/kernels:scatter_nd_op_test -- \
            --benchmark_filter=BM_ScatterNd \
            --benchmark_out=/tmp/cc_baseline.json \
            --benchmark_out_format=json
          cat /tmp/cc_baseline.json

      - name: Upload C++ Baseline Results
        uses: actions/upload-artifact@v4
        with:
          name: cc-baseline-results
          path: /tmp/cc_baseline.json

  cc-benchmark-optimized:
    name: C++ Optimized (optimize-scatter-nd)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout optimized branch
        uses: actions/checkout@v4
        with:
          ref: optimize-scatter-nd
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf build-essential

      - name: Install Bazelisk
        run: |
          sudo wget -q https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64 -O /usr/local/bin/bazel
          sudo chmod +x /usr/local/bin/bazel
          bazel --version

      - name: Configure TF
        run: |
          python -m pip install numpy packaging requests
          export TF_NEED_CUDA=0
          export TF_NEED_ROCM=0
          export CC_OPT_FLAGS="-march=native"
          export PYTHON_BIN_PATH=$(which python)
          export USE_DEFAULT_PYTHON_LIB_PATH=1
          export TF_SET_ANDROID_WORKSPACE=0
          export TF_CONFIGURE_IOS=0
          yes "" | python configure.py || true

      - name: Run C++ Google Benchmark
        run: |
          bazel run -c opt \
            --config=nogcp \
            --config=nonccl \
            --jobs=4 \
            --local_ram_resources=HOST_RAM*0.7 \
            //tensorflow/core/kernels:scatter_nd_op_test -- \
            --benchmark_filter=BM_ScatterNd \
            --benchmark_out=/tmp/cc_optimized.json \
            --benchmark_out_format=json
          cat /tmp/cc_optimized.json

      - name: Upload C++ Optimized Results
        uses: actions/upload-artifact@v4
        with:
          name: cc-optimized-results
          path: /tmp/cc_optimized.json

  cc-compare:
    name: C++ Compare Results
    needs: [cc-benchmark-baseline, cc-benchmark-optimized]
    runs-on: ubuntu-22.04
    steps:
      - name: Download baseline
        uses: actions/download-artifact@v4
        with:
          name: cc-baseline-results
          path: baseline

      - name: Download optimized
        uses: actions/download-artifact@v4
        with:
          name: cc-optimized-results
          path: optimized

      - name: Compare C++ Benchmarks
        run: |
          python3 << 'COMPARE'
          import json, os

          with open("baseline/cc_baseline.json") as f:
              b_data = json.load(f)
          with open("optimized/cc_optimized.json") as f:
              o_data = json.load(f)

          b_map = {item["name"]: item for item in b_data.get("benchmarks", [])}
          o_map = {item["name"]: item for item in o_data.get("benchmarks", [])}

          lines = []
          lines.append("## ⚡ ScatterNd C++ Kernel Benchmark (Before vs After)")
          lines.append("")
          lines.append("| Benchmark | Baseline CPU | Optimized CPU | Speedup | Latency Change | Throughput Gain |")
          lines.append("| :--- | :---: | :---: | :---: | :---: | :---: |")

          print("=" * 120)
          print("  ScatterNd C++ Microbenchmark: BEFORE vs AFTER")
          print("=" * 120)
          print(f"  {'Benchmark':<40} {'Baseline':>12} {'Optimized':>12} {'Speedup':>10} {'Latency':>10} {'Throughput':>12}")
          print("-" * 120)

          fast_path_speedups = []
          control_speedups = []

          report = {"comparisons": []}

          for name, b_item in sorted(b_map.items()):
              if name not in o_map:
                  continue
              o_item = o_map[name]
              b_cpu = b_item.get("cpu_time", 0.0)
              o_cpu = o_item.get("cpu_time", 0.0)
              unit = b_item.get("time_unit", "ns")

              speedup = (b_cpu / o_cpu) if o_cpu > 0 else 1.0
              change_pct = ((b_cpu - o_cpu) / b_cpu * 100.0) if b_cpu > 0 else 0.0

              b_th = b_item.get("items_per_second", 0.0)
              o_th = o_item.get("items_per_second", 0.0)
              th_gain = (o_th / b_th) if b_th > 0 else speedup

              is_fast_path = name.endswith("/1")
              if is_fast_path:
                  fast_path_speedups.append(speedup)
                  badge = "🟢" if speedup >= 1.05 else ("🔴" if speedup <= 0.95 else "⚪")
              else:
                  control_speedups.append(speedup)
                  badge = "⚪" if abs(speedup - 1.0) <= 0.05 else ("🟢" if speedup > 1.05 else "🔴")

              print(f"  {badge} {name:<38} {b_cpu:>10.1f}{unit} {o_cpu:>10.1f}{unit} {speedup:>9.2f}x {change_pct:>+9.1f}% {th_gain:>11.2f}x")
              lines.append(f"| {badge} `{name}` | {b_cpu:.1f} {unit} | {o_cpu:.1f} {unit} | **{speedup:.2f}x** | `{change_pct:+.1f}%` | **{th_gain:.2f}x** |")

              report["comparisons"].append({
                  "benchmark": name,
                  "is_fast_path": is_fast_path,
                  "baseline_cpu": b_cpu,
                  "optimized_cpu": o_cpu,
                  "unit": unit,
                  "speedup": round(speedup, 4),
                  "change_pct": round(change_pct, 2),
                  "throughput_gain": round(th_gain, 4)
              })

          avg_fast = sum(fast_path_speedups) / len(fast_path_speedups) if fast_path_speedups else 1.0
          avg_ctrl = sum(control_speedups) / len(control_speedups) if control_speedups else 1.0

          print("-" * 120)
          print(f"  Summary: Fast-path (slice_size=1) Average Speedup: {avg_fast:.2f}x")
          print(f"  Summary: Control group (slice_size>1) Average Speedup: {avg_ctrl:.2f}x (Regression check: ~1.0x)")
          print("=" * 120)

          lines.append("")
          lines.append("### Summary")
          lines.append(f"- **Fast-Path (`slice_size = 1`) Average Speedup:** **`{avg_fast:.2f}x`** 🚀")
          lines.append(f"- **Control Group (`slice_size > 1`) Average Speedup:** **`{avg_ctrl:.2f}x`** (Expected ~1.00x, proves zero regression on existing paths)")

          summary_content = "\n".join(lines)
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a") as f:
                  f.write(summary_content + "\n")

          with open("cc_comparison_report.json", "w") as f:
              json.dump(report, f, indent=2)
          COMPARE

      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: cc-comparison-report
          path: cc_comparison_report.json

  # =========================================================================
  # PYTHON END-TO-END BENCHMARKS (Full Wheel Build + High-Level TF Ops)
  # =========================================================================
  py-benchmark-baseline:
    name: Python Baseline (master)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          df -h

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf build-essential

      - name: Install Bazelisk
        run: |
          sudo wget -q https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64 -O /usr/local/bin/bazel
          sudo chmod +x /usr/local/bin/bazel
          bazel --version

      - name: Build TF pip package (CPU only)
        run: |
          python -m pip install numpy packaging requests
          export TF_NEED_CUDA=0
          export TF_NEED_ROCM=0
          export CC_OPT_FLAGS="-march=native"
          export PYTHON_BIN_PATH=$(which python)
          export USE_DEFAULT_PYTHON_LIB_PATH=1
          export TF_SET_ANDROID_WORKSPACE=0
          export TF_CONFIGURE_IOS=0
          yes "" | python configure.py || true
          
          mkdir -p build_output
          bazel build //tensorflow/tools/pip_package:wheel \
            --repo_env=WHEEL_NAME=tensorflow_cpu \
            --config=opt \
            --config=nogcp \
            --config=nonccl \
            --jobs=4 \
            --local_ram_resources=HOST_RAM*0.7

      - name: Install built TF
        run: |
          pip install $(find bazel-bin/tensorflow/tools/pip_package/ -name "*.whl") --force-reinstall

      - name: Write benchmark script
        run: |
          cat << 'BENCH' > /tmp/scatter_benchmark.py
          import tensorflow as tf
          import numpy as np
          import time, json, os
          os.environ["CUDA_VISIBLE_DEVICES"] = ""
          
          def bench(name, fn, iters=500, warmup=50):
              for _ in range(warmup): fn()
              times = []
              for _ in range(iters):
                  s = time.perf_counter()
                  fn()
                  times.append((time.perf_counter() - s) * 1000)
              t = np.array(times)
              return {"name": name, "mean_ms": round(float(np.mean(t)), 4),
                      "median_ms": round(float(np.median(t)), 4),
                      "p5_ms": round(float(np.percentile(t, 5)), 4),
                      "p95_ms": round(float(np.percentile(t, 95)), 4),
                      "p99_ms": round(float(np.percentile(t, 99)), 4)}
          
          results = []
          with tf.device("/CPU:0"):
              for op_name, op_fn_factory in [
                  ("scatter_nd", lambda b, s, v: (
                      lambda idx=tf.random.uniform([b,1],0,v,tf.int32),
                             upd=tf.random.uniform([b] if s==1 else [b,s]),
                             sh=tf.constant([v] if s==1 else [v,s], tf.int32):
                      tf.scatter_nd(idx, upd, sh))),
                  ("tensor_scatter_nd_update", lambda b, s, v: (
                      lambda idx=tf.random.uniform([b,1],0,v,tf.int32),
                             upd=tf.random.uniform([b] if s==1 else [b,s]),
                             ten=tf.zeros([v] if s==1 else [v,s]):
                      tf.tensor_scatter_nd_update(ten, idx, upd))),
                  ("tensor_scatter_nd_add", lambda b, s, v: (
                      lambda idx=tf.random.uniform([b,1],0,v,tf.int32),
                             upd=tf.random.uniform([b] if s==1 else [b,s]),
                             ten=tf.zeros([v] if s==1 else [v,s]):
                      tf.tensor_scatter_nd_add(ten, idx, upd))),
              ]:
                  for batch in [10000, 50000, 100000]:
                      for slc in [1, 8, 32, 64]:
                          fn = tf.function(op_fn_factory(batch, slc, 500000), jit_compile=False)
                          r = bench(f"{op_name}|batch={batch}|slice={slc}", fn)
                          results.append(r)
                          print(f"  {r['name']:<55} mean={r['mean_ms']:8.3f}ms  median={r['median_ms']:8.3f}ms")
          
          with open("benchmark_results.json", "w") as f:
              json.dump({"tf_version": tf.__version__, "results": results}, f, indent=2)
          print(f"\nTF Version: {tf.__version__}")
          print(f"Total benchmarks: {len(results)}")
          BENCH

      - name: Run Python benchmark
        run: cd /tmp && python scatter_benchmark.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: py-baseline-results
          path: /tmp/benchmark_results.json

  py-benchmark-optimized:
    name: Python Optimized (optimize-scatter-nd)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          df -h

      - name: Checkout optimized branch
        uses: actions/checkout@v4
        with:
          ref: optimize-scatter-nd
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf build-essential

      - name: Install Bazelisk
        run: |
          sudo wget -q https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64 -O /usr/local/bin/bazel
          sudo chmod +x /usr/local/bin/bazel
          bazel --version

      - name: Build TF pip package (CPU only)
        run: |
          python -m pip install numpy packaging requests
          export TF_NEED_CUDA=0
          export TF_NEED_ROCM=0
          export CC_OPT_FLAGS="-march=native"
          export PYTHON_BIN_PATH=$(which python)
          export USE_DEFAULT_PYTHON_LIB_PATH=1
          export TF_SET_ANDROID_WORKSPACE=0
          export TF_CONFIGURE_IOS=0
          yes "" | python configure.py || true
          
          mkdir -p build_output
          bazel build //tensorflow/tools/pip_package:wheel \
            --repo_env=WHEEL_NAME=tensorflow_cpu \
            --config=opt \
            --config=nogcp \
            --config=nonccl \
            --jobs=4 \
            --local_ram_resources=HOST_RAM*0.7

      - name: Install built TF
        run: |
          pip install $(find bazel-bin/tensorflow/tools/pip_package/ -name "*.whl") --force-reinstall

      - name: Write benchmark script
        run: |
          cat << 'BENCH' > /tmp/scatter_benchmark.py
          import tensorflow as tf
          import numpy as np
          import time, json, os
          os.environ["CUDA_VISIBLE_DEVICES"] = ""
          
          def bench(name, fn, iters=500, warmup=50):
              for _ in range(warmup): fn()
              times = []
              for _ in range(iters):
                  s = time.perf_counter()
                  fn()
                  times.append((time.perf_counter() - s) * 1000)
              t = np.array(times)
              return {"name": name, "mean_ms": round(float(np.mean(t)), 4),
                      "median_ms": round(float(np.median(t)), 4),
                      "p5_ms": round(float(np.percentile(t, 5)), 4),
                      "p95_ms": round(float(np.percentile(t, 95)), 4),
                      "p99_ms": round(float(np.percentile(t, 99)), 4)}
          
          results = []
          with tf.device("/CPU:0"):
              for op_name, op_fn_factory in [
                  ("scatter_nd", lambda b, s, v: (
                      lambda idx=tf.random.uniform([b,1],0,v,tf.int32),
                             upd=tf.random.uniform([b] if s==1 else [b,s]),
                             sh=tf.constant([v] if s==1 else [v,s], tf.int32):
                      tf.scatter_nd(idx, upd, sh))),
                  ("tensor_scatter_nd_update", lambda b, s, v: (
                      lambda idx=tf.random.uniform([b,1],0,v,tf.int32),
                             upd=tf.random.uniform([b] if s==1 else [b,s]),
                             ten=tf.zeros([v] if s==1 else [v,s]):
                      tf.tensor_scatter_nd_update(ten, idx, upd))),
                  ("tensor_scatter_nd_add", lambda b, s, v: (
                      lambda idx=tf.random.uniform([b,1],0,v,tf.int32),
                             upd=tf.random.uniform([b] if s==1 else [b,s]),
                             ten=tf.zeros([v] if s==1 else [v,s]):
                      tf.tensor_scatter_nd_add(ten, idx, upd))),
              ]:
                  for batch in [10000, 50000, 100000]:
                      for slc in [1, 8, 32, 64]:
                          fn = tf.function(op_fn_factory(batch, slc, 500000), jit_compile=False)
                          r = bench(f"{op_name}|batch={batch}|slice={slc}", fn)
                          results.append(r)
                          print(f"  {r['name']:<55} mean={r['mean_ms']:8.3f}ms  median={r['median_ms']:8.3f}ms")
          
          with open("benchmark_results.json", "w") as f:
              json.dump({"tf_version": tf.__version__, "results": results}, f, indent=2)
          print(f"\nTF Version: {tf.__version__}")
          print(f"Total benchmarks: {len(results)}")
          BENCH

      - name: Run Python benchmark
        run: cd /tmp && python scatter_benchmark.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: py-optimized-results
          path: /tmp/benchmark_results.json

  py-compare:
    name: Python Compare Results
    needs: [py-benchmark-baseline, py-benchmark-optimized]
    runs-on: ubuntu-22.04
    steps:
      - name: Download baseline
        uses: actions/download-artifact@v4
        with:
          name: py-baseline-results
          path: baseline

      - name: Download optimized
        uses: actions/download-artifact@v4
        with:
          name: py-optimized-results
          path: optimized

      - name: Compare Python Benchmarks
        run: |
          python3 << 'COMPARE'
          import json, os

          with open("baseline/benchmark_results.json") as f:
              baseline = json.load(f)
          with open("optimized/benchmark_results.json") as f:
              optimized = json.load(f)

          base_map = {r["name"]: r for r in baseline["results"]}
          opt_map = {r["name"]: r for r in optimized["results"]}

          lines = []
          lines.append("## 🐍 ScatterNd Python End-to-End Benchmark (Before vs After)")
          lines.append(f"**Baseline TF:** `{baseline['tf_version']}` | **Optimized TF:** `{optimized['tf_version']}`")
          lines.append("")
          lines.append("| Benchmark | Baseline (median) | Optimized (median) | Speedup | Change |")
          lines.append("| :--- | :---: | :---: | :---: | :---: |")

          print("=" * 120)
          print(f"  ScatterNd Python Benchmark: BEFORE vs AFTER")
          print(f"  Baseline TF: {baseline['tf_version']}  |  Optimized TF: {optimized['tf_version']}")
          print("=" * 120)
          print(f"  {'Benchmark':<55} {'Baseline':>10} {'Optimized':>10} {'Speedup':>10} {'Change':>10}")
          print("-" * 120)

          for name in sorted(base_map.keys()):
              if name not in opt_map:
                  continue
              b = base_map[name]["median_ms"]
              o = opt_map[name]["median_ms"]
              speedup = b / o if o > 0 else 1.0
              change = ((b - o) / b) * 100 if b > 0 else 0.0
              marker = "🟢" if change > 5 else ("🔴" if change < -5 else "⚪")
              print(f"  {marker} {name:<53} {b:>8.3f}ms {o:>8.3f}ms {speedup:>8.2f}x {change:>+8.1f}%")
              lines.append(f"| {marker} `{name}` | {b:.3f} ms | {o:.3f} ms | **{speedup:.2f}x** | `{change:+.1f}%` |")

          slice1 = [n for n in base_map if "|slice=1|" in n or n.endswith("|slice=1")]
          slice_other = [n for n in base_map if n not in slice1]

          def avg_speedup(names):
              speedups = [base_map[n]["median_ms"] / opt_map[n]["median_ms"] for n in names if n in opt_map and opt_map[n]["median_ms"] > 0]
              return sum(speedups) / len(speedups) if speedups else 0

          avg_s1 = avg_speedup(slice1)
          avg_so = avg_speedup(slice_other)

          print("\n" + "=" * 120)
          print(f"  SUMMARY")
          print(f"  slice=1 (optimized path) avg speedup:  {avg_s1:.2f}x")
          print(f"  slice>1 (standard path)  avg speedup:  {avg_so:.2f}x  (should be ~1.0x)")
          print("=" * 120)

          lines.append("")
          lines.append("### Summary")
          lines.append(f"- **`slice=1` (optimized path) average speedup:** **`{avg_s1:.2f}x`** 🚀")
          lines.append(f"- **`slice>1` (control group) average speedup:** **`{avg_so:.2f}x`** (Control group, ~1.00x)")

          summary_content = "\n".join(lines)
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a") as f:
                  f.write(summary_content + "\n")
          COMPARE

      - name: Save comparison report
        run: |
          python3 << 'REPORT'
          import json

          with open("baseline/benchmark_results.json") as f:
              baseline = json.load(f)
          with open("optimized/benchmark_results.json") as f:
              optimized = json.load(f)

          base_map = {r["name"]: r for r in baseline["results"]}
          opt_map = {r["name"]: r for r in optimized["results"]}

          report = {"baseline_tf": baseline["tf_version"], "optimized_tf": optimized["tf_version"], "comparisons": []}
          for name in base_map:
              if name not in opt_map: continue
              b = base_map[name]["median_ms"]
              o = opt_map[name]["median_ms"]
              report["comparisons"].append({
                  "name": name, "baseline_ms": b, "optimized_ms": o,
                  "speedup": round(b/o, 4) if o > 0 else None,
                  "change_pct": round(((b-o)/b)*100, 2) if b > 0 else None
              })

          with open("py_comparison_report.json", "w") as f:
              json.dump(report, f, indent=2)
          REPORT

      - name: Upload Python comparison
        uses: actions/upload-artifact@v4
        with:
          name: py-comparison-report
          path: py_comparison_report.json
