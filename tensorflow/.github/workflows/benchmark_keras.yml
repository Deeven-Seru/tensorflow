name: Benchmark Keras

on:
  push:
    branches:
      - benchmark-keras-test

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 10
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Bazelisk
      run: |
        wget https://github.com/bazelbuild/bazelisk/releases/download/v1.19.0/bazelisk-linux-amd64
        chmod +x bazelisk-linux-amd64
        sudo mv bazelisk-linux-amd64 /usr/local/bin/bazel
    - name: Mount Bazel Cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/bazel
        key: bazel-Linux-${{ github.sha }}
        restore-keys: bazel-Linux-
    - name: Save benchmark files
      run: |
        cp -r tensorflow/tools/benchmark_keras /tmp/
    - name: Run Keras Benchmark (After Optimization)
      run: |
        bazel run -c opt //tensorflow/tools/benchmark_keras:benchmark_keras
    - name: Run Keras Benchmark (Before Optimization)
      run: |
        git checkout HEAD~2
        cp -r /tmp/benchmark_keras tensorflow/tools/
        bazel run -c opt //tensorflow/tools/benchmark_keras:benchmark_keras
